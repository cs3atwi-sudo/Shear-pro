name: Build APK

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-24.04

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Verify environment
        run: |
          echo "===== PYTHON ====="
          python --version
          python -m pip --version

          echo "===== JAVA ====="
          java -version

      - name: Install system dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            build-essential \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo6 \
            cmake \
            libffi-dev \
            libssl-dev \
            libltdl-dev \
            gettext \
            libsqlite3-dev

      - name: Install Rust
        run: |
          curl https://sh.rustup.rs -sSf | sh -s -- -y
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install "cython==0.29.37"
          python -m pip install "buildozer"

      - name: Verify Buildozer
        run: |
          echo "===== BUILDOZER ====="
          buildozer --version

          echo "===== CYTHON ====="
          python -c "import Cython; print(Cython.__version__)"

      - name: Check project files
        run: |
          echo "===== PROJECT FILES ====="
          ls -lah

          echo "===== MAIN.PY ====="
          test -f main.py && echo "main.py OK" || echo "ERROR: main.py missing"

          echo "===== BUILDOZER.SPEC ====="
          test -f buildozer.spec && echo "buildozer.spec OK" || echo "ERROR: buildozer.spec missing"

          echo "===== REQUIREMENTS ====="
          ls requirements.txt pyproject.toml 2>/dev/null || true

      - name: Check buildozer.spec
        run: |
          echo "===== BUILDOZER SPEC CONTENT ====="
          cat buildozer.spec

      - name: Clean previous builds
        run: |
          rm -rf .buildozer
          rm -rf bin
          rm -rf build

      - name: Build APK
        env:
          BUILDOZER_WARN_ON_ROOT: "0"
        run: |
          buildozer -v android debug

      - name: Find APK
        if: always()
        run: |
          echo "===== BIN DIRECTORY ====="
          ls -lah bin || true

          echo "===== ALL APK FILES ====="
          find . -type f -name "*.apk" -print || true

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Sendar-Lite-APK
          path: bin/*.apk
          if-no-files-found: error
